name: Verify two Android friends

on:
  workflow_call:
    inputs:
      app-ref:
        required: true
        type: string
      game-artifact:
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-friends-smoke.yml"
      - ".github/workflows/android-delta-chat-smoke.yml"
      - "tools/check_android_friends.py"
      - "tools/check_delta_chat_android.py"
      - "tools/check_voice_sdp.dart"
      - "lib/voice_calls.dart"
      - "lib/friends.dart"
      - "lib/chatmail.dart"
      - "lib/main.dart"
      - "lib/setup_help.dart"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/java/io/tablecircle/prototype/ChatAlerts.java"
      - "android/app/src/main/java/io/tablecircle/prototype/ChatListenerService.java"
      - "android/app/src/main/java/io/tablecircle/prototype/ChatSyncJob.java"
      - "lib/online_match*.dart"
      - "android/app/src/main/java/io/tablecircle/prototype/ChatFiles.java"
      - "android/app/src/main/java/io/tablecircle/prototype/VoicePeer.java"

permissions:
  actions: read
  contents: read

jobs:
  friends:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          repository: JustTrySomthing/zompa
          ref: ${{ inputs.app-ref || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.game-artifact != ''
        with:
          name: ${{ inputs.game-artifact }}
          path: ${{ runner.temp }}/game-release
      - name: Reuse an emulator APK for test-only changes
        id: reuse
        if: inputs.game-artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_dir=build/app/outputs/flutter-apk
          repo="repos/$GITHUB_REPOSITORY/actions"
          runs=$(gh api "$repo/workflows/android-friends-smoke.yml/runs?branch=main&status=completed&event=push&per_page=10")
          while read -r run source; do
            if ! git diff --quiet "$source" HEAD -- android lib assets pubspec.yaml pubspec.lock \
              tools/install_love_runtime.sh tools/install_chatmail_core.sh tools/check_voice_sdp.dart \
              ':!android/app/proguard-rules.pro'; then
              continue
            fi
            artifacts=$(gh api "$repo/runs/$run/artifacts")
            if jq -e 'any(.artifacts[]; .name == "android-friends-test-apk" and (.expired | not))' <<< "$artifacts" >/dev/null; then
              gh run download "$run" --name android-friends-test-apk --dir "$apk_dir"
              unzip -l "$apk_dir/app-debug.apk" 'lib/x86_64/libchatmail_rpc.so'
              echo "reused=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"' <<< "$runs")
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.reuse.outputs.reused != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter and Android tools
        run: |
          set -euo pipefail
          if [[ "${{ steps.reuse.outputs.reused }}" != true ]]; then
            git init -q "$RUNNER_TEMP/flutter"
            git -C "$RUNNER_TEMP/flutter" fetch --depth=1 https://github.com/flutter/flutter.git ab2912035e160d9cad6306df307576da6128ebdb
            git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
            echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          fi
          bash tools/install_android_sdk.sh 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build an emulator APK with Chatmail and WebRTC
        if: steps.reuse.outputs.reused != 'true'
        env:
          ORG_GRADLE_PROJECT_zompaEmulatorFriends: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          GAME_ARTIFACT: ${{ inputs.game-artifact }}
        run: |
          flutter pub get --enforce-lockfile
          dart tools/check_voice_sdp.dart
          check=false
          if [[ -n "$GAME_ARTIFACT" ]]; then
            check=true
          fi
          flutter build apk --debug --target-platform android-x64 --no-pub \
            --dart-define="ZOMPA_GAME_RELEASE_CHECK=$check"
          unzip -l build/app/outputs/flutter-apk/app-debug.apk 'lib/x86_64/libchatmail_rpc.so'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-friends-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Prepare checks and start two emulators
        env:
          GAME_ARTIFACT: ${{ inputs.game-artifact }}
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_HOME/platform-tools/adb"
          for port in 5554 5556; do
            echo no | "$avdmanager" create avd --name "zompa$port" --package 'system-images;android-35;google_apis;x86_64'
            "$ANDROID_HOME/emulator/emulator" -avd "zompa$port" -port "$port" -cores 2 -memory 2048 \
              -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect \
              -camera-front none -camera-back emulated > "$RUNNER_TEMP/friends-$port.log" 2>&1 &
          done
          python3 -m venv "$RUNNER_TEMP/friends-check"
          "$RUNNER_TEMP/friends-check/bin/pip" install --quiet opencv-python-headless==4.12.0.88 Pillow zxing-cpp==2.3.0
          for port in 5554 5556; do
            serial="emulator-$port"
            timeout 240 "$adb" -s "$serial" wait-for-device
            timeout 240 bash -c 'until [[ $("$1" -s "$2" shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done' _ "$adb" "$serial"
            "$adb" -s "$serial" shell wm size 720x1280
            "$adb" -s "$serial" shell wm density 240
            "$adb" -s "$serial" shell input keyevent KEYCODE_WAKEUP
            "$adb" -s "$serial" shell wm dismiss-keyguard
            "$adb" -s "$serial" shell settings put global window_animation_scale 0
            "$adb" -s "$serial" shell settings put global transition_animation_scale 0
            "$adb" -s "$serial" shell settings put global animator_duration_scale 0
            "$adb" -s "$serial" install build/app/outputs/flutter-apk/app-debug.apk
          done
          checks="$RUNNER_TEMP/friends-check/bin/python"
          if [[ -n "$GAME_ARTIFACT" ]]; then
            fixture="$RUNNER_TEMP/game-release"
            build=$(jq -er '.games[0].build' "$fixture/catalog-v2.json")
            name=$(jq -er '.games[0].url | split("/") | last' "$fixture/catalog-v2.json")
            sha=$(jq -er '.games[0].sha256' "$fixture/catalog-v2.json")
            [[ "$build" =~ ^[1-9][0-9]*$ && "$name" =~ ^[A-Za-z0-9.-]+\.zomp$ ]]
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
            printf '%s  %s\n' "$sha" "$fixture/$name" | sha256sum --check
            unzip -p "$fixture/$name" zompa.lua | cmp - sdk/zompa.lua
            stage() {
              local serial="$1"
              local app=io.tablecircle.prototype
              "$adb" -s "$serial" shell "run-as $app mkdir -p files/games/drop-four"
              "$adb" -s "$serial" shell -T "run-as $app tee files/game-release-check.json >/dev/null" \
                < "$fixture/catalog-v2.json"
              "$adb" -s "$serial" shell -T "run-as $app tee files/games/drop-four/$build.zomp >/dev/null" \
                < "$fixture/$name"
            }
            stage emulator-5554
            ANDROID_SERIAL=emulator-5554 ZOMPA_GAME_RELEASE_CHECK=1 \
              "$checks" tools/check_android_game_flow.py "$adb" "$RUNNER_TEMP"
            "$adb" -s emulator-5554 shell pm clear io.tablecircle.prototype
            stage emulator-5554
            stage emulator-5556
            "$checks" tools/check_android_friends.py "$adb" --game-release
          else
            "$checks" tools/check_android_friends.py "$adb"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-friends-diagnostics
          path: |
            ${{ runner.temp }}/friends-*.log
            ${{ runner.temp }}/game-flow
          if-no-files-found: ignore
