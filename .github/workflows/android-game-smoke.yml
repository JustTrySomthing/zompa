name: Verify Android game flow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-game-smoke.yml"
      - "tools/check_android_game_flow.py"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter and SDK
        run: |
          set -euo pipefail
          flutter_revision=ab2912035e160d9cad6306df307576da6128ebdb
          git init -q "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 https://github.com/flutter/flutter.git "$flutter_revision"
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          bash tools/install_android_sdk.sh 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'             'ndk;28.2.13676358' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build the emulator test APK
        env:
          ORG_GRADLE_PROJECT_zompadoEmulatorSmoke: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-x64 --no-pub
      - name: Start Android and check the game flow
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_HOME/platform-tools/adb"
          echo no | "$avdmanager" create avd --name zompado --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd zompado -no-window -no-audio -no-snapshot -no-boot-anim             -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 210 "$adb" wait-for-device
          timeout 210 bash -c 'until [[ $("$1" shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done' _ "$adb"
          "$adb" shell wm size 720x1280
          "$adb" shell wm density 240
          "$adb" shell input keyevent 82
          "$adb" install build/app/outputs/flutter-apk/app-debug.apk
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/pip" install --quiet Pillow
          "$RUNNER_TEMP/checks/bin/python" tools/check_android_game_flow.py "$adb" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-game-flow-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/game-flow
          if-no-files-found: ignore
