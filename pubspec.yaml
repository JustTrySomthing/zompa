name: zompa
description: Zompa, an Android-first game and chat app.
publish_to: none
version: 0.5.51+60
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - docs/brand/bubble.png
    - docs/brand/wordmark.png
    - assets/licenses/Chatmail-Core-MPL-2.0.txt
    - assets/licenses/WebRTC-BSD.txt
    - assets/licenses/love-11.5.txt
    - assets/licenses/love.js-MIT.txt
    - assets/licenses/ZXing-Apache-2.0.txt
    - assets/games/cats-vs-dogs.webp
    - assets/games/cat-token.webp
    - assets/games/dog-token.webp
    - assets/chat/emoji.json
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
